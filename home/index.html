// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(str) {
  if (!str) return "";
  const [y,m,d] = str.split("-");
  return new Date(+y,+m-1,+d).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});
}

function buildICS(ev) {
  const dt = ev.date ? ev.date.replace(/-/g,"") : "";
  const tm = ev.time ? ev.time.replace(/:/g,"")+"00" : "120000";
  const dtend = dt; // same day
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TorqueClub//EN",
    "BEGIN:VEVENT",
    `DTSTART:${dt}T${tm}`,
    `DTEND:${dt}T${tm}`,
    `SUMMARY:${(ev.title||"").replace(/,/g,"\\,")}`,
    `DESCRIPTION:${(ev.description||"").replace(/\n/g,"\\n").replace(/,/g,"\\,")}`,
    `LOCATION:${(ev.location||"").replace(/,/g,"\\,")}`,
    `ORGANIZER:CN=${ev.clubName||ev.clubId||"Club"}`,
    "END:VEVENT","END:VCALENDAR"
  ];
  return lines.join("\r\n");
}

function downloadICS(ev) {
  const blob = new Blob([buildICS(ev)], {type:"text/calendar"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = (ev.title||"event").replace(/\s+/g,"-")+".ics";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Member Clubs page ─────────────────────────────────────────────────────────
function ClubsPage() {
  const [clubs, setClubs]   = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function load() {
      try {
        const snap = await db.collection("clubs").get();
        const raw  = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        // For each active club, try to fetch accountSettings
        const withSettings = await Promise.all(raw.map(async club => {
          if (club.status !== "active") return null;
          try {
            const doc = await db.collection("clubs").doc(club.id).collection("data").doc("accountSettings").get();
            const acct = doc.exists ? JSON.parse(doc.data().value) : {};
            return { ...club, acct };
          } catch(e) {
            return { ...club, acct:{} };
          }
        }));
        setClubs(withSettings.filter(Boolean));
      } catch(e) { console.error("loadClubs:", e); }
      setLoading(false);
    }
    load();
  }, []);

  if (loading) return <LoadingPage/>;

  return <div className="fade-up" style={{ maxWidth:1120, margin:"0 auto", padding:"48px 24px" }}>
    <div style={{ marginBottom:40 }}>
      <div style={{ fontFamily:"var(--font-m)", fontSize:11, color:"var(--gold)", letterSpacing:"0.2em",
        textTransform:"uppercase", marginBottom:8 }}>Directory</div>
      <h1 style={{ fontFamily:"var(--font-h)", fontSize:"clamp(28px,4vw,44px)", fontWeight:800,
        color:"var(--primary)", letterSpacing:"0.02em" }}>Member Clubs</h1>
      <p style={{ fontSize:15, color:"var(--text3)", marginTop:8 }}>
        Australian vehicle enthusiast clubs powered by TorqueClub.
      </p>
    </div>

    {clubs.length === 0 && (
      <div style={{ textAlign:"center", padding:"60px 0", color:"var(--text4)", fontSize:14 }}>
        No clubs listed yet.
      </div>
    )}

    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:20 }}>
      {clubs.map(club=>{
        const a = club.acct || {};
        const logo    = a.logo || null;
        const blurb   = a.blurb || "";
        const website = a.website || club.netlifyUrl || "";
        const name    = a.registeredName || a.tradingName || club.name || club.id;
        return (
          <div key={club.id} style={{ background:"var(--bg2)", border:"1px solid var(--border)",
            borderRadius:12, padding:24, display:"flex", flexDirection:"column", gap:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:14, minHeight:52 }}>
              {logo
                ? <img src={logo} alt={name} style={{ height:52, width:"auto", maxWidth:100,
                    objectFit:"contain", flexShrink:0 }}/>
                : <div style={{ width:52, height:52, background:"var(--primary)", borderRadius:8,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    flexShrink:0, fontFamily:"var(--font-h)", fontSize:20, fontWeight:900,
                    color:"var(--gold)", letterSpacing:"0.08em" }}>
                    {(name||"?")[0].toUpperCase()}
                  </div>
              }
              <div style={{ fontFamily:"var(--font-b)", fontSize:15, fontWeight:700, color:"var(--text)" }}>
                {name}
              </div>
            </div>
            {blurb && <div style={{ fontSize:13, color:"var(--text3)", lineHeight:1.6 }}>{blurb}</div>}
            {website && (
              <a href={website.startsWith("http")?website:"https://"+website}

                  display:"inline-flex", alignItems:"center", gap:4 }}>

// ── Events page ───────────────────────────────────────────────────────────────
function EventsPage() {
  const [events, setEvents]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView]       = useState("list"); // list | calendar

  useEffect(() => {
    async function load() {
      try {
        const snap = await db.collection("platform").doc("events").collection("queue")
          .where("status","==","approved").get();
        const items = snap.docs.map(d => ({ docId:d.id, ...d.data() }));
        items.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
        setEvents(items);
      } catch(e) { console.error("loadEvents:", e); }
      setLoading(false);
    }
    load();
  }, []);

  const typeIcon = {show:"🏆",drive:"🚗",social:"🥂",charity:"❤️",competition:"🏁"};
  const typeName = {show:"Show",drive:"Drive",social:"Social",charity:"Charity",competition:"Competition"};

  const upcoming = events.filter(e => e.date >= new Date().toISOString().slice(0,10));
  const past     = events.filter(e => e.date <  new Date().toISOString().slice(0,10));

  if (loading) return <LoadingPage/>;

  function CalendarView() {
    const today = new Date();
    const [month, setMonth] = useState(today.getMonth());
    const [year,  setYear]  = useState(today.getFullYear());

    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDay    = new Date(year, month, 1).getDay(); // 0=Sun
    const monthName   = new Date(year, month, 1).toLocaleDateString("en-AU",{month:"long",year:"numeric"});

    const cells = [];
    for (let i=0; i<firstDay; i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(d);

    function eventsOnDay(d) {
      const str = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      return events.filter(e => e.date===str);
    }

    return <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
        <button onClick={()=>{ const m=month-1<0?11:month-1; setMonth(m); if(m===11)setYear(y=>y-1); }}
          style={{ background:"none", border:"1px solid var(--border)", borderRadius:6, padding:"6px 12px",
            cursor:"pointer", fontSize:16, color:"var(--text2)" }}>‹</button>
        <div style={{ flex:1, textAlign:"center", fontFamily:"var(--font-h)", fontSize:20,
          fontWeight:700, color:"var(--primary)", letterSpacing:"0.06em" }}>{monthName}</div>
        <button onClick={()=>{ const m=month+1>11?0:month+1; setMonth(m); if(m===0)setYear(y=>y+1); }}
          style={{ background:"none", border:"1px solid var(--border)", borderRadius:6, padding:"6px 12px",
            cursor:"pointer", fontSize:16, color:"var(--text2)" }}>›</button>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
        {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
          <div key={d} style={{ textAlign:"center", fontFamily:"var(--font-m)", fontSize:10,
            color:"var(--text4)", padding:"6px 0", letterSpacing:"0.1em" }}>{d}</div>
        ))}
        {cells.map((d,i)=>{
          const evs = d ? eventsOnDay(d) : [];
          const isToday = d && today.getDate()===d && today.getMonth()===month && today.getFullYear()===year;
          return <div key={i} style={{ minHeight:64, border:"1px solid var(--border)", borderRadius:6,
            background: isToday ? "#fff8ed" : "var(--bg2)", padding:4,
            borderColor: isToday ? "var(--gold)" : "var(--border)" }}>
            {d && <div style={{ fontSize:11, fontWeight:isToday?700:400,
              color:isToday?"var(--gold)":"var(--text3)", marginBottom:3 }}>{d}</div>}
            {evs.map(ev=>(
              <div key={ev.docId} title={ev.title}
                style={{ fontSize:10, background:"var(--gold)", color:"var(--primary)",

                  cursor:"pointer" }} onClick={()=>downloadICS(ev)}>
                {typeIcon[ev.type]||"★"} {ev.title}
              </div>
            ))}
          </div>;
        })}
      </div>
      <div style={{ marginTop:12, fontSize:11, color:"var(--text4)", fontFamily:"var(--font-m)", textAlign:"center" }}>
        Click an event on the calendar to download .ics
      </div>
    </div>;
  }

  function EventCard({ ev }) {
    return <div style={{ background:"var(--bg2)", border:"1px solid var(--border)", borderRadius:12,
      padding:24, display:"flex", gap:16, alignItems:"flex-start", flexWrap:"wrap" }}>
      <div style={{ fontSize:32, flexShrink:0 }}>{typeIcon[ev.type]||"★"}</div>
      <div style={{ flex:1, minWidth:200 }}>
        <div style={{ fontFamily:"var(--font-b)", fontSize:16, fontWeight:700, color:"var(--text)", marginBottom:4 }}>
          {ev.title}
        </div>
        <div style={{ fontSize:12, color:"var(--text3)", fontFamily:"var(--font-m)", marginBottom:6 }}>
          {fmtDate(ev.date)}{ev.time?" · "+ev.time:""} · {typeName[ev.type]||ev.type}
        </div>
        <div style={{ fontSize:13, color:"var(--text2)", marginBottom:6 }}>📍 {ev.location}</div>
        {ev.clubName && <div style={{ fontSize:12, color:"var(--text4)", marginBottom:8 }}>
          Hosted by {ev.clubName}
        </div>}
        {ev.description && <div style={{ fontSize:13, color:"var(--text3)", lineHeight:1.6 }}>
          {ev.description.slice(0,200)}{ev.description.length>200?"…":""}
        </div>}
      </div>
      <button onClick={()=>downloadICS(ev)}
        style={{ padding:"8px 16px", background:"none", border:"1px solid var(--border)",
          borderRadius:7, fontSize:12, color:"var(--text2)", cursor:"pointer",
          fontFamily:"var(--font-b)", fontWeight:600, flexShrink:0,
          display:"flex", alignItems:"center", gap:6 }}>
        📅 Add to Calendar
      </button>
    </div>;
  }

  return <div className="fade-up" style={{ maxWidth:1120, margin:"0 auto", padding:"48px 24px" }}>
    <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between",
      marginBottom:32, flexWrap:"wrap", gap:16 }}>
      <div>
        <div style={{ fontFamily:"var(--font-m)", fontSize:11, color:"var(--gold)", letterSpacing:"0.2em",
          textTransform:"uppercase", marginBottom:8 }}>Community Calendar</div>
        <h1 style={{ fontFamily:"var(--font-h)", fontSize:"clamp(28px,4vw,44px)", fontWeight:800,
          color:"var(--primary)", letterSpacing:"0.02em" }}>Upcoming Events</h1>
        <p style={{ fontSize:15, color:"var(--text3)", marginTop:8 }}>
          Events from TorqueClub member clubs across Australia.
        </p>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={()=>setView("list")}
          style={{ padding:"8px 16px", border:"1px solid var(--border)", borderRadius:7, cursor:"pointer",
            fontSize:13, fontWeight:600, fontFamily:"var(--font-b)",
            background:view==="list"?"var(--primary)":"var(--bg2)",
            color:view==="list"?"white":"var(--text2)" }}>
          List
        </button>
        <button onClick={()=>setView("calendar")}
          style={{ padding:"8px 16px", border:"1px solid var(--border)", borderRadius:7, cursor:"pointer",
            fontSize:13, fontWeight:600, fontFamily:"var(--font-b)",
            background:view==="calendar"?"var(--primary)":"var(--bg2)",
            color:view==="calendar"?"white":"var(--text2)" }}>
          Calendar
        </button>
      </div>
    </div>

    {view==="calendar" && <CalendarView/>}

    {view==="list" && <>
      {upcoming.length===0 && past.length===0 && (
        <div style={{ textAlign:"center", padding:"60px 0", color:"var(--text4)", fontSize:14 }}>
          No events currently listed.
        </div>
      )}
      {upcoming.length>0 && <>
        <div style={{ fontFamily:"var(--font-m)", fontSize:11, color:"var(--text3)", letterSpacing:"0.12em",
          textTransform:"uppercase", marginBottom:12 }}>Upcoming ({upcoming.length})</div>
        <div style={{ display:"flex", flexDirection:"column", gap:12, marginBottom:36 }}>
          {upcoming.map(ev=><EventCard key={ev.docId} ev={ev}/>)}
        </div>
      </>}
      {past.length>0 && <>
        <div style={{ fontFamily:"var(--font-m)", fontSize:11, color:"var(--text3)", letterSpacing:"0.12em",
          textTransform:"uppercase", marginBottom:12 }}>Past Events ({past.length})</div>
        <div style={{ display:"flex", flexDirection:"column", gap:12, opacity:0.6 }}>
          {past.map(ev=><EventCard key={ev.docId} ev={ev}/>)}
        </div>
      </>}
    </>}
  </div>;
}

// ── Loading ───────────────────────────────────────────────────────────────────
function LoadingPage() {
  return <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
    minHeight:"40vh", gap:12, color:"var(--text4)", fontSize:14, fontFamily:"var(--font-m)" }}>
    <div style={{ width:18, height:18, border:"2px solid var(--border)", borderTopColor:"var(--gold)",
      borderRadius:"50%", animation:"spin .7s linear infinite" }}/>
    Loading…
    <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
  </div>;
}

// ── Footer ────────────────────────────────────────────────────────────────────
function Footer({ setPage }) {
  return <footer style={{ background:"var(--primary2)", borderTop:"3px solid var(--gold)",
    padding:"32px 24px", marginTop:64 }}>
    <div style={{ maxWidth:1120, margin:"0 auto", display:"flex", alignItems:"center",
      justifyContent:"space-between", flexWrap:"wrap", gap:16 }}>
      <div>
        <div style={{ fontFamily:"var(--font-h)", fontSize:18, fontWeight:900, color:"var(--gold)",
          letterSpacing:"0.18em", marginBottom:4 }}>TORQUECLUB</div>
        <div style={{ fontSize:12, color:"rgba(255,255,255,.3)", fontFamily:"var(--font-m)" }}>
          Club Management Platform · Australia
        </div>
      </div>
      <div style={{ display:"flex", gap:20 }}>
        {[["home","Home"],["clubs","Member Clubs"],["events","Events"]].map(([id,label])=>(
          <button key={id} onClick={()=>setPage(id)} style={{ background:"none", border:"none",
            cursor:"pointer", fontSize:13, color:"rgba(255,255,255,.45)", fontFamily:"var(--font-b)" }}>
            {label}
          </button>
        ))}
      </div>
      <div style={{ fontSize:12, color:"rgba(255,255,255,.2)", fontFamily:"var(--font-m)" }}>
        © {new Date().getFullYear()} TorqueClub
      </div>
    </div>
  </footer>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");

  // Sync scroll to top on page change
  useEffect(() => { window.scrollTo(0,0); }, [page]);

  return <>
    <Nav page={page} setPage={setPage}/>
    {page==="home"   && <HomePage  setPage={setPage}/>}
    {page==="clubs"  && <ClubsPage/>}
    {page==="events" && <EventsPage/>}
    <Footer setPage={setPage}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
