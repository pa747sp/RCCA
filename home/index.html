// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(str) {
  if (!str) return "";
  const [y,m,d] = str.split("-");
  return new Date(+y,+m-1,+d).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});
}

function buildICS(ev) {
  const dt = ev.date ? ev.date.replace(/-/g,"") : "";
  const tm = ev.time ? ev.time.replace(/:/g,"")+"00" : "120000";
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TorqueClub//EN",
    "BEGIN:VEVENT",
    `DTSTART:${dt}T${tm}`,`DTEND:${dt}T${tm}`,
    `SUMMARY:${(ev.title||"").replace(/,/g,"\\,")}`,
    `DESCRIPTION:${(ev.description||"").replace(/\n/g,"\\n").replace(/,/g,"\\,")}`,
    `LOCATION:${(ev.location||"").replace(/,/g,"\\,")}`,
    `ORGANIZER:CN=${ev.clubName||ev.clubId||"Club"}`,
    "END:VEVENT","END:VCALENDAR"
  ];
  return lines.join("\r\n");
}

function downloadICS(ev) {
  const blob = new Blob([buildICS(ev)], {type:"text/calendar"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = (ev.title||"event").replace(/\s+/g,"-")+".ics";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Member Clubs page ─────────────────────────────────────────────────────────
function ClubsPage() {
  const [clubs, setClubs]     = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function load() {
      try {
        const snap = await db.collection("clubs").get();
        const raw  = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        const withSettings = await Promise.all(raw.map(async club => {
          if (club.status !== "active") return null;
          // Try subcollection for full account settings (blurb, website etc.)
          let acct = {};
          try {
            const doc = await db.collection("clubs").doc(club.id).collection("data").doc("accountSettings").get();
            if (doc.exists) acct = JSON.parse(doc.data().value);
          } catch(e) {}
          // Top-level doc fields override subcollection — these are kept in sync by the portal
          // and are more reliably written (direct Firestore set, not via dbSet wrapper)
          if (club.logoUrl) acct.logo = club.logoUrl;
          if (club.primaryColour) acct.primaryColour = club.primaryColour;
          if (club.secondaryColour) acct.secondaryColour = club.secondaryColour;
          return { ...club, acct };
        }));
        setClubs(withSettings.filter(Boolean));
      } catch(e) { console.error("loadClubs:", e); }
      setLoading(false);
    }
    load();
  }, []);

  return <div className="fade-up" style={{maxWidth:1160,margin:"0 auto",padding:"52px 28px 72px"}}>
    <div style={{marginBottom:44}}>
      <SectionLabel>Directory</SectionLabel>
      <h1 style={{fontFamily:"var(--font-d)",fontSize:"clamp(26px,3.5vw,40px)",fontWeight:700,
        color:"var(--text)",marginBottom:8}}>Member Clubs</h1>
      <p style={{fontSize:15,color:"var(--text3)"}}>
        Australian vehicle enthusiast clubs powered by TorqueClub.
      </p>
    </div>

    {loading&&<div style={{padding:"60px 0",textAlign:"center"}}><Spinner size={28}/></div>}

    {!loading&&clubs.length===0&&(
      <div style={{textAlign:"center",padding:"60px 0",color:"var(--text4)",
        fontFamily:"var(--font-m)",fontSize:13,letterSpacing:"0.08em"}}>
        No clubs listed yet.
      </div>
    )}

    {!loading&&clubs.length>0&&(
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:16}}>
        {clubs.map(club=>{
          const a = club.acct || {};
          const logo         = a.logo || null;
          const blurb        = a.blurb || "";
          const extSite      = a.website || "";
          const name         = a.registeredName || a.tradingName || club.name || club.id;
          const portalUrl    = club.netlifyUrl || ("https://" + club.id + ".torqueclub.com.au");
          const primaryCol   = a.primaryColour || null;
          const secondaryCol = a.secondaryColour || null;
          return (
            <Card key={club.id} className="hover-lift" style={{padding:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              {/* Brand colour bar */}
              <div style={{height:4,background:primaryCol||"var(--burg)",flexShrink:0}}/>
              <div style={{padding:22,display:"flex",flexDirection:"column",gap:14}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                {logo
                  ? <img src={logo} alt={name} style={{height:48,width:"auto",maxWidth:100,
                      objectFit:"contain",flexShrink:0,borderRadius:6,
                      border:"1px solid var(--border)",padding:4,background:"white"}}/>
                  : <div style={{width:48,height:48,background:"var(--burg)",borderRadius:8,

                <div style={{fontFamily:"var(--font-d)",fontSize:15,fontWeight:700,color:"var(--text)",lineHeight:1.3}}>
                  {name}
                </div>
              </div>
              {blurb&&<div style={{fontSize:13,color:"var(--text3)",lineHeight:1.7,
                paddingTop:10,borderTop:"1px solid var(--border)"}}>{blurb}</div>}
              <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                <a href={portalUrl} target="_blank" rel="noopener noreferrer"
                  style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,
                    color:"var(--gold)",fontFamily:"var(--font-m)",fontWeight:500,
                    letterSpacing:"0.04em"}}>
                  Visit Club Portal →
                </a>
                {extSite&&extSite!==portalUrl&&(
                  <a href={extSite.startsWith("http")?extSite:"https://"+extSite}
                    target="_blank" rel="noopener noreferrer"
                    style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,
                      color:"var(--text3)",fontFamily:"var(--font-m)",fontWeight:500}}>
                    Website ↗
                  </a>
                )}
              </div>
              </div>{/* end padding wrapper */}
            </Card>
          );
        })}
      </div>
    )}
  </div>;
}

// ── Events page ───────────────────────────────────────────────────────────────
function EventsPage() {
  const [events,  setEvents]  = useState([]);
  const [loading, setLoading] = useState(true);
  const [view,    setView]    = useState("list");

  useEffect(() => {
    async function load() {
      try {
        const snap = await db.collection("platform").doc("events").collection("queue")
          .where("status","==","approved").get();
        const items = snap.docs.map(d => ({ docId:d.id, ...d.data() }));
        items.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
        setEvents(items);
      } catch(e) { console.error("loadEvents:", e); }
      setLoading(false);
    }
    load();
  }, []);

  const typeIcon = {show:"🏆",drive:"🚗",social:"🥂",charity:"❤️",competition:"🏁"};
  const typeName = {show:"Show",drive:"Drive",social:"Social",charity:"Charity",competition:"Competition"};
  const today    = new Date().toISOString().slice(0,10);
  const upcoming = events.filter(e => (e.date||"") >= today);
  const past     = events.filter(e => (e.date||"") <  today);

  function EventCard({ ev }) {
    return <Card style={{padding:20,display:"flex",gap:16,alignItems:"flex-start",flexWrap:"wrap"}}>
      <div style={{width:48,height:48,background:"var(--bg3)",border:"1px solid var(--border)",
        borderRadius:"var(--r)",display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:22,flexShrink:0}}>{typeIcon[ev.type]||"★"}</div>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontFamily:"var(--font-d)",fontSize:16,fontWeight:700,color:"var(--text)",marginBottom:4}}>
          {ev.title}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"4px 16px",marginBottom:6}}>
          <span style={{fontFamily:"var(--font-m)",fontSize:11,color:"var(--text4)",letterSpacing:"0.04em"}}>
            {fmtDate(ev.date)}{ev.time?" · "+ev.time:""}
          </span>
          {(ev.type||"")&&<span style={{fontFamily:"var(--font-m)",fontSize:11,color:"var(--gold)",
            letterSpacing:"0.06em",textTransform:"uppercase"}}>{typeName[ev.type]||ev.type}</span>}
        </div>
        <div style={{fontSize:13,color:"var(--text2)",marginBottom:ev.clubName||ev.description?6:0}}>
          📍 {ev.location}
        </div>
        {ev.clubName&&<div style={{fontSize:12,color:"var(--text4)",fontFamily:"var(--font-m)",
          marginBottom:ev.description?6:0}}>Hosted by {ev.clubName}</div>}
        {ev.description&&<div style={{fontSize:13,color:"var(--text3)",lineHeight:1.65}}>
          {ev.description.slice(0,220)}{ev.description.length>220?"…":""}
        </div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
        <a href={"https://"+(ev.clubId||"demo")+".torqueclub.com.au/#events"} target="_blank" rel="noopener noreferrer"
          style={{padding:"7px 16px",background:"var(--burg)",color:"white",
            borderRadius:"var(--r)",fontSize:12,fontFamily:"var(--font-b)",fontWeight:600,
            display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
          View Club Events →
        </a>
        <button onClick={()=>downloadICS(ev)}
          style={{padding:"7px 16px",background:"none",border:"1px solid var(--border2)",
            borderRadius:"var(--r)",fontSize:12,color:"var(--text3)",cursor:"pointer",
            fontFamily:"var(--font-b)",fontWeight:600,display:"flex",
            alignItems:"center",gap:5,transition:"all .15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--gold)";e.currentTarget.style.color="var(--gold)";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--border2)";e.currentTarget.style.color="var(--text3)";}}>
          📅 Add to Calendar
        </button>
      </div>
    </Card>;
  }

  function CalendarView() {
    const now = new Date();
    const [month, setMonth] = useState(now.getMonth());
    const [year,  setYear]  = useState(now.getFullYear());

    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDay    = new Date(year, month, 1).getDay();
    const monthName   = new Date(year, month, 1).toLocaleDateString("en-AU",{month:"long",year:"numeric"});

    const cells = [];
    for (let i=0;i<firstDay;i++) cells.push(null);
    for (let d=1;d<=daysInMonth;d++) cells.push(d);

    function eventsOnDay(d) {
      const str = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      return events.filter(e=>e.date===str);
    }

    return <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button onClick={()=>{ const m=month-1<0?11:month-1; setMonth(m); if(m===11)setYear(y=>y-1); }}
          style={{background:"none",border:"1px solid var(--border)",borderRadius:"var(--r)",
            padding:"6px 14px",cursor:"pointer",fontSize:16,color:"var(--text3)",
            fontFamily:"var(--font-d)",transition:"all .15s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="var(--gold)"}
          onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>‹</button>
        <div style={{flex:1,textAlign:"center",fontFamily:"var(--font-d)",fontSize:20,
          fontWeight:700,color:"var(--text)",letterSpacing:"0.02em"}}>{monthName}</div>
        <button onClick={()=>{ const m=month+1>11?0:month+1; setMonth(m); if(m===0)setYear(y=>y+1); }}
          style={{background:"none",border:"1px solid var(--border)",borderRadius:"var(--r)",
            padding:"6px 14px",cursor:"pointer",fontSize:16,color:"var(--text3)",
            fontFamily:"var(--font-d)",transition:"all .15s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="var(--gold)"}
          onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
          <div key={d} style={{textAlign:"center",fontFamily:"var(--font-m)",fontSize:9,
            color:"var(--text4)",padding:"6px 0",letterSpacing:"0.14em",textTransform:"uppercase"}}>{d}</div>
        ))}
        {cells.map((d,i)=>{
          const evs    = d ? eventsOnDay(d) : [];
          const isTday = d&&now.getDate()===d&&now.getMonth()===month&&now.getFullYear()===year;
          return <div key={i} style={{minHeight:60,border:"1px solid",
            borderColor:isTday?"var(--gold)":"var(--border)",borderRadius:6,
            background:isTday?"#fffbf2":"var(--bg2)",padding:"4px 5px"}}>
            {d&&<div style={{fontSize:10,fontFamily:"var(--font-m)",
              fontWeight:isTday?700:400,color:isTday?"var(--gold)":"var(--text4)",marginBottom:3}}>{d}</div>}
            {evs.map(ev=>(
              <div key={ev.docId} title={`${ev.title} — click to download .ics`}
                onClick={()=>downloadICS(ev)}
                style={{fontSize:9,background:"var(--burg)",color:"white",borderRadius:3,
                  padding:"2px 5px",marginBottom:2,fontFamily:"var(--font-m)",
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                  cursor:"pointer",letterSpacing:"0.02em"}}>
                {typeIcon[ev.type]||"★"} {ev.title}
              </div>
            ))}
          </div>;
        })}
      </div>
      <div style={{marginTop:10,fontSize:11,color:"var(--text4)",fontFamily:"var(--font-m)",
        textAlign:"center",letterSpacing:"0.06em"}}>Click any event to download .ics calendar file</div>
    </div>;
  }

  return <div className="fade-up" style={{maxWidth:1160,margin:"0 auto",padding:"52px 28px 72px"}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",
      marginBottom:44,flexWrap:"wrap",gap:16}}>
      <div>
        <SectionLabel>Community Calendar</SectionLabel>
        <h1 style={{fontFamily:"var(--font-d)",fontSize:"clamp(26px,3.5vw,40px)",fontWeight:700,
          color:"var(--text)",marginBottom:8}}>Upcoming Events</h1>
        <p style={{fontSize:15,color:"var(--text3)"}}>
          Events from TorqueClub member clubs across Australia.
        </p>
      </div>
      <div style={{display:"flex",gap:4,background:"var(--bg3)",border:"1px solid var(--border)",
        borderRadius:"var(--r)",padding:4}}>
        {["list","calendar"].map(v=>(
          <button key={v} onClick={()=>setView(v)}
            style={{padding:"7px 18px",border:"none",borderRadius:6,cursor:"pointer",
              fontSize:12,fontWeight:600,fontFamily:"var(--font-m)",letterSpacing:"0.06em",
              textTransform:"uppercase",transition:"all .15s",
              background:view===v?"var(--burg)":"none",
              color:view===v?"white":"var(--text3)"}}>
            {v==="list"?"List":"Cal"}
          </button>
        ))}
      </div>
    </div>

    {loading&&<div style={{padding:"60px 0",textAlign:"center"}}><Spinner size={28}/></div>}

    {!loading&&view==="calendar"&&<CalendarView/>}

    {!loading&&view==="list"&&<>
      {upcoming.length===0&&past.length===0&&(
        <div style={{textAlign:"center",padding:"60px 0",color:"var(--text4)",
          fontFamily:"var(--font-m)",fontSize:13,letterSpacing:"0.08em"}}>
          No events currently listed.
        </div>
      )}
      {upcoming.length>0&&<>
        <div style={{fontFamily:"var(--font-m)",fontSize:10,color:"var(--text4)",letterSpacing:"0.16em",
          textTransform:"uppercase",marginBottom:12}}>Upcoming · {upcoming.length}</div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:40}}>
          {upcoming.map(ev=><EventCard key={ev.docId} ev={ev}/>)}
        </div>
      </>}
      {past.length>0&&<>
        <Divider label="Past Events"/>
        <div style={{display:"flex",flexDirection:"column",gap:10,opacity:.6}}>
          {past.map(ev=><EventCard key={ev.docId} ev={ev}/>)}
        </div>
      </>}
    </>}
  </div>;
}

// ── Contact section ───────────────────────────────────────────────────────────

    padding:"56px 28px"}}>
    <div style={{maxWidth:680,margin:"0 auto",textAlign:"center"}}>
      <div style={{fontFamily:"var(--font-m)",fontSize:10,color:"var(--gold)",letterSpacing:"0.2em",
        textTransform:"uppercase",marginBottom:12}}>Get in touch</div>
      <h2 style={{fontFamily:"var(--font-d)",fontSize:"clamp(22px,3vw,32px)",fontWeight:700,
        color:"var(--text)",marginBottom:14}}>Interested in TorqueClub?</h2>
      <p style={{fontSize:15,color:"var(--text3)",lineHeight:1.7,marginBottom:28}}>
        Whether you want to bring your club onto the platform, have a question about features, or just want to say g'day — reach out directly.
      </p>
      <a href="mailto:nick@torqueclub.com.au"
        style={{display:"inline-flex",alignItems:"center",gap:8,padding:"14px 32px",
          background:"var(--burg)",color:"white",borderRadius:"var(--r)",fontSize:14,
          fontFamily:"var(--font-b)",fontWeight:700,letterSpacing:"0.04em",textDecoration:"none",

        ✉ nick@torqueclub.com.au
      </a>
    </div>

}

// ── Footer ────────────────────────────────────────────────────────────────────
function Footer({ setPage }) {
  return <footer style={{background:"var(--burg-dk)",borderTop:"3px solid var(--gold)",
    padding:"32px 28px",marginTop:0}}>
    <div style={{maxWidth:1160,margin:"0 auto",display:"flex",alignItems:"center",
      justifyContent:"space-between",flexWrap:"wrap",gap:20}}>
      <div>
        <div style={{fontFamily:"var(--font-c)",fontSize:16,fontWeight:700,color:"var(--gold)",
          letterSpacing:"0.22em",marginBottom:4}}>TORQUECLUB</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,.28)",fontFamily:"var(--font-m)",
          letterSpacing:"0.1em"}}>Club Management Platform · Australia</div>
      </div>
      <nav style={{display:"flex",gap:6}}>
        {[["home","Home"],["clubs","Member Clubs"],["events","Events"]].map(([id,label])=>(
          <button key={id} onClick={()=>setPage(id)}
            style={{background:"none",border:"none",cursor:"pointer",
              fontSize:12,color:"rgba(255,255,255,.38)",fontFamily:"var(--font-b)",
              padding:"4px 10px",transition:"color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.color="rgba(255,255,255,.8)"}
            onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.38)"}>
            {label}
          </button>
        ))}
        <a href="mailto:nick@torqueclub.com.au"
          style={{background:"none",border:"none",cursor:"pointer",
            fontSize:12,color:"rgba(255,255,255,.38)",fontFamily:"var(--font-b)",
            padding:"4px 10px",textDecoration:"none",transition:"color .15s"}}
          onMouseEnter={e=>e.currentTarget.style.color="rgba(255,255,255,.8)"}
          onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.38)"}>
          Contact
        </a>
      </nav>
      <div style={{fontSize:11,color:"rgba(255,255,255,.18)",fontFamily:"var(--font-m)"}}>
        © {new Date().getFullYear()} TorqueClub
      </div>
    </div>
  </footer>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  useEffect(() => { window.scrollTo({top:0,behavior:"smooth"}); }, [page]);
  return <>
    <Nav page={page} setPage={setPage}/>
    {page==="home"   && <HomePage  setPage={setPage}/>}
    {page==="clubs"  && <ClubsPage/>}
    {page==="events" && <EventsPage/>}
    <ContactSection/>
    <Footer setPage={setPage}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
